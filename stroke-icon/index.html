<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление иконками</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 0;
            margin: 0;
        }

        .controls {
            background: #f5f5f5;
            padding: 24px;
            border-bottom: 1px solid #ddd;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 200px;
        }

        label {
            font-weight: bold;
        }

        .hint {
            font-size: 13px;
            color: #777;
            margin-top: 4px;
        }

        .icons-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 24px;
            min-height: 200px;
            border-top: 1px solid #eee;
            position: relative;
            align-items: flex-start;
        }

        .icons-container.empty::before {
            content: "Перетащите сюда SVG-файлы или используйте кнопку выше";
            position: absolute;
            left: 24px;
            top: 24px;
            right: 24px;
            color: #999;
            font-size: 14px;
        }

        .icons-container.drag-over {
            border: 2px dashed #007bff;
            background: #f0f8ff;
        }

        .icon-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            border: 1px solid #eee;
            border-radius: 4px;
            min-width: 32px;
            min-height: 32px;
            background: #fff;
        }

        .icon-wrapper svg {
            display: block;
        }
    </style>
</head>
<body>
    <div class="controls">
        <div class="control-group">
            <label for="size">Размер иконок</label>
            <input type="range" id="size" min="8" max="256" value="128">
            <span id="size-value">128px</span>
        </div>

        <div class="control-group">
            <label for="stroke">Толщина линий</label>
            <input type="range" id="stroke" min="0.1" max="4" value="1.5" step="0.1">
            <span id="stroke-value">1.5</span>
        </div>

        <div class="control-group">
            <label for="file-input">Загрузить SVG-иконки</label>
            <input type="file" id="file-input" accept=".svg" multiple>
            <div class="hint">Можно выбрать несколько файлов или перетащить их в область ниже.</div>
        </div>
    </div>

    <div class="icons-container empty" id="icons-container"></div>

    <script>
        const iconsContainer = document.getElementById('icons-container');
        const sizeInput = document.getElementById('size');
        const strokeInput = document.getElementById('stroke');
        const sizeValue = document.getElementById('size-value');
        const strokeValue = document.getElementById('stroke-value');
        const fileInput = document.getElementById('file-input');

        function updateEmptyState() {
            if (iconsContainer.children.length === 0) {
                iconsContainer.classList.add('empty');
            } else {
                iconsContainer.classList.remove('empty');
            }
        }

        function updateIconsSize(size) {
            document.querySelectorAll('.icon-wrapper svg').forEach(svg => {
                svg.style.width = size + 'px';
                svg.style.height = size + 'px';
            });
            sizeValue.textContent = size + 'px';
        }

        function updateStrokeWidth(width) {
            // Применяем stroke-width ко всем элементам внутри svg
            document.querySelectorAll('.icon-wrapper svg, .icon-wrapper svg *').forEach(el => {
                el.style.strokeWidth = width;
            });
            strokeValue.textContent = width;
        }

        async function handleFiles(fileList) {
            const files = Array.from(fileList).filter(file =>
                file.type === 'image/svg+xml' || file.name.toLowerCase().endsWith('.svg')
            );

            if (files.length === 0) return;

            for (const file of files) {
                try {
                    const text = await file.text();
                    const wrapper = document.createElement('div');
                    wrapper.className = 'icon-wrapper';
                    wrapper.innerHTML = text;

                    // На всякий случай уберём width/height из самого SVG, чтобы наш контрол всё перезаписал
                    const svg = wrapper.querySelector('svg');
                    if (svg) {
                        svg.removeAttribute('width');
                        svg.removeAttribute('height');
                    }

                    iconsContainer.appendChild(wrapper);
                } catch (e) {
                    console.error('Ошибка чтения файла', file.name, e);
                }
            }

            // Применяем текущие значения контролов к новым иконкам
            updateIconsSize(sizeInput.value);
            updateStrokeWidth(strokeInput.value);
            updateEmptyState();
        }

        // Обработчик для input type="file"
        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
            // сбрасываем value, чтобы можно было загрузить те же файлы ещё раз
            e.target.value = '';
        });

        // ---- Drag & Drop на .icons-container ----
        ['dragenter', 'dragover'].forEach(eventName => {
            iconsContainer.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
                iconsContainer.classList.add('drag-over');
            });
        });

        ['dragleave', 'dragend'].forEach(eventName => {
            iconsContainer.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
                iconsContainer.classList.remove('drag-over');
            });
        });

        iconsContainer.addEventListener('drop', (e) => {
            e.preventDefault();
            e.stopPropagation();
            iconsContainer.classList.remove('drag-over');

            const dt = e.dataTransfer;
            if (dt && dt.files && dt.files.length) {
                handleFiles(dt.files);
            }
        });

        // Инициализация контролов при загрузке
        window.addEventListener('load', () => {
            updateIconsSize(sizeInput.value);
            updateStrokeWidth(strokeInput.value);
            updateEmptyState();
        });

        // Живое обновление от ползунков
        sizeInput.addEventListener('input', (e) => {
            updateIconsSize(e.target.value);
        });

        strokeInput.addEventListener('input', (e) => {
            updateStrokeWidth(e.target.value);
        });
    </script>
</body>
</html>
