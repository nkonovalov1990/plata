<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление иконками</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 0;
            margin: 0;
        }

        .controls {
            background: #f5f5f5;
            padding: 24px;
            display: flex;
            gap: 40px;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icons-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px;
        }

        .icon-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            border: 1px solid #eee;
            border-radius: 4px;
            min-width: 32px;
            min-height: 32px;
        }

        .icon-wrapper svg {
            width: 24px;
            height: 24px;
        }

        input[type="range"] {
            width: 200px;
        }

        label {
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="controls">
        <div class="control-group">
            <label for="size">Размер иконок</label>
            <input type="range" id="size" min="12" max="128" value="24">
            <span id="size-value">24px</span>
        </div>
        <div class="control-group">
            <label for="stroke">Толщина линий</label>
            <input type="range" id="stroke" min="0.1" max="2" value="2" step="0.1">
            <span id="stroke-value">2</span>
        </div>
    </div>
    <div class="icons-container" id="icons-container"></div>

    <script>
        async function loadIcons() {
            const iconFiles = [
                // 'user.svg',
                // 'heart.svg',
                'gasoline.svg',
                // 'freeze.svg',
                // 'card_gift.svg',
                'ine.svg',
                // 'check-circle.svg',
            ];

            const container = document.getElementById('icons-container');

            for (const iconFile of iconFiles) {
                try {
                    const response = await fetch(iconFile);
                    const svgText = await response.text();
                    
                    const wrapper = document.createElement('div');
                    wrapper.className = 'icon-wrapper';
                    wrapper.innerHTML = svgText;
                    container.appendChild(wrapper);
                } catch (error) {
                    console.error(`Ошибка загрузки иконки ${iconFile}:`, error);
                }
            }
        }

        function updateIconsSize(size) {
            document.querySelectorAll('.icon-wrapper svg').forEach(svg => {
                svg.style.width = `${size}px`;
                svg.style.height = `${size}px`;
            });
            document.getElementById('size-value').textContent = `${size}px`;
        }

        function updateStrokeWidth(width) {
            document.querySelectorAll('.icon-wrapper svg *').forEach(element => {
                if (element.tagName !== 'svg') {
                    element.style.strokeWidth = width;
                }
            });
            document.getElementById('stroke-value').textContent = `${width}`;
        }

        // Инициализация контролов
        document.getElementById('size').addEventListener('input', (e) => {
            updateIconsSize(e.target.value);
        });

        document.getElementById('stroke').addEventListener('input', (e) => {
            updateStrokeWidth(e.target.value);
        });

        // Загрузка иконок при загрузке страницы
        window.addEventListener('load', loadIcons);
    </script>
</body>
</html>
